<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>時空身體地圖・空間篇｜試用版</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.role{display:flex;gap:6px;flex-wrap:wrap}
.role .opt{padding:6px 12px;font-size:14px}
.pv{background:#7a5638;color:#fff;font-family:var(--fu);font-size:13px;text-align:center;padding:6px;border-radius:6px}
.noimg{height:min(30vh,240px);display:flex;align-items:center;justify-content:center;background:var(--soft);border-radius:6px;color:var(--muted);font-family:var(--fu);font-size:14px;text-align:center;padding:16px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="fx"></div>
<button class="fab" id="fab" data-act="report">回報</button>
<script src="config.js"></script>
<script src="engine.js"></script>
<script>
const {cfg:CFG, preview:PREVIEW} = loadCfg();
const QS = CFG.sources.questions.filter(q=>q.enabled), MOVES = CFG.sources.moves.filter(m=>m.enabled), CMPS = CFG.sources.compares.filter(c=>c.enabled), EX = CFG.explain;
const PRAISE = ['很好！','答得好！','你很認真喔','觀察得真仔細','做得很棒','就是這樣！','好棒，繼續加油'];
const S = {doc:false, snd:true, i:0, t0:null, a:{}, mv:{}, ph:{mode:null,img:null,lm:null,ai:null}, crops:null, regions:null, cmp:{}, res:null, slide:0, rp:0, saved:false, fit:null, docJ:null};
const FLOW = ['cover','brief', ...QS.map(q=>q.id), 'rw1', ...MOVES.map(m=>m.id), 'rw2', 'ph1','ph2','ph3','points','look', ...CMPS.map(c=>c.id), 'rw3', 'inter','scan','result'];
const STAGES = ['問一問','動一動','比一比','看結果'];
const STAGE_OF = n => n==='cover'||n==='brief'?0 : n[0]==='Q'||n==='rw1'?1 : n[0]==='M'||n==='rw2'?2 : ['ph1','ph2','ph3','points','look','rw3'].includes(n)||n[0]==='P'?3 : 4;
const idc = id => S.doc ? `<span class="idchip">${id}</span>` : '';
const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const F = d => `class="fade" style="animation-delay:${d}s"`;
Tele.init(CFG.version+(PREVIEW?'-preview':''));

// ---------- 聲音 ----------
const AU={ctx:null,on:false};
function auInit(){ if(AU.ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; const C=AU.ctx=new AC(); AU.master=C.createGain(); AU.master.gain.value=0; AU.master.connect(C.destination);
  const len=C.sampleRate*3.8, buf=C.createBuffer(2,len,C.sampleRate); for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8); }
  AU.rev=C.createConvolver(); AU.rev.buffer=buf; const rg=C.createGain(); rg.gain.value=.6; AU.rev.connect(rg); rg.connect(AU.master); AU.dry=C.createGain(); AU.dry.gain.value=.55; AU.dry.connect(AU.master); AU.sfx=C.createGain(); AU.sfx.gain.value=.45; AU.sfx.connect(C.destination); AU.sfx.connect(AU.rev); }
function musicStart(){ auInit(); if(!AU.ctx) return; const C=AU.ctx; C.resume(); if(AU.on) return; AU.on=true; const lp=C.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520; lp.connect(AU.dry); lp.connect(AU.rev);
  AU.drone=[146.83,220,293.66].map((f,i)=>{ const o=C.createOscillator(); o.type=i===2?'triangle':'sine'; o.frequency.value=f; const g=C.createGain(); g.gain.value=i===2?.018:.05; const l=C.createOscillator(); l.frequency.value=.05+i*.03; const lg=C.createGain(); lg.gain.value=.025; l.connect(lg); lg.connect(g.gain); o.connect(g); g.connect(lp); o.start(); l.start(); return [o,l]; });
  AU.master.gain.cancelScheduledValues(C.currentTime); AU.master.gain.setTargetAtTime(.55,C.currentTime,2); const scale=[293.66,329.63,369.99,440,493.88,587.33,659.25,739.99,880];
  const pluck=()=>{ if(!AU.on) return; const t=C.currentTime+.05, f=scale[Math.floor(Math.random()*scale.length)]; const o=C.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(f*1.012,t); o.frequency.exponentialRampToValueAtTime(f,t+.3); const o2=C.createOscillator(); o2.type='sine'; o2.frequency.value=f*2; const g2=C.createGain(); g2.gain.value=.22; const g=C.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.075,t+.012); g.gain.exponentialRampToValueAtTime(.0006,t+3.4); o.connect(g); o2.connect(g2); g2.connect(g); g.connect(AU.dry); g.connect(AU.rev); o.start(t); o2.start(t); o.stop(t+3.6); o2.stop(t+3.6); AU.timer=setTimeout(pluck,2000+Math.random()*3400); };
  AU.timer=setTimeout(pluck,1500); }
function musicStop(){ if(!AU.ctx||!AU.on) return; AU.on=false; clearTimeout(AU.timer); const C=AU.ctx; AU.master.gain.setTargetAtTime(0,C.currentTime,.5); const d=AU.drone; setTimeout(()=>d&&d.forEach(([o,l])=>{try{o.stop();l.stop();}catch(e){}}),2500); }
function chime(big){ if(!S.snd) return; auInit(); if(!AU.ctx) return; const C=AU.ctx; C.resume(); (big?[587.33,739.99,880,1174.66]:[659.25,880]).forEach((f,i)=>{ const t=C.currentTime+i*(big?.13:.09); const o=C.createOscillator(); o.type='sine'; o.frequency.value=f; const g=C.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.16,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+1.5); o.connect(g); g.connect(AU.sfx); o.start(t); o.stop(t+1.6); }); }
function tick(){ if(!S.snd||!AU.ctx) return; const C=AU.ctx,t=C.currentTime; const o=C.createOscillator(); o.type='sine'; o.frequency.value=1318.5; const g=C.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.06,t+.005); g.gain.exponentialRampToValueAtTime(.001,t+.4); o.connect(g); g.connect(AU.sfx); o.start(t); o.stop(t+.45); }
function petals(n=14){ if(RM()) return; const fx=$('#fx'), cols=['#b8936a','#d8bf98','#8f6a49','#e6d4b8','#a5814f']; for(let i=0;i<n;i++){ const p=document.createElement('i'); p.className='petal'; const a=Math.random()*Math.PI*2, d=90+Math.random()*130; p.style.setProperty('--x',Math.cos(a)*d+'px'); p.style.setProperty('--y',Math.sin(a)*d+'px'); p.style.setProperty('--r',(Math.random()*540-270)+'deg'); p.style.setProperty('--c',cols[i%cols.length]); fx.appendChild(p); setTimeout(()=>p.remove(),1200); } }
let praising=false;
function praise(cb,txt){ if(praising) return; praising=true; const t=txt||PRAISE[Math.floor(Math.random()*PRAISE.length)]; const el=document.createElement('div'); el.className='cele'; el.innerHTML=`<div class="cb"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30"/><path d="M19 33l9 9 17-19"/></svg><p>${esc(t)}</p></div>`; document.body.appendChild(el); petals(12); chime(false); setTimeout(()=>{ el.remove(); praising=false; cb&&cb(); }, RM()?500:950); }

// ---------- 連續圖 ----------
let FLIPS=[];
const flipTag = frames => frames&&frames.length ? `<div class="flip" data-flip>${frames.map(([src],i)=>`<img src="${src}" alt="" class="${i===0?'on':''}">`).join('')}<div class="fd">${frames.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div><div class="cap" data-caps='${JSON.stringify(frames.map(f=>f[1])).replace(/'/g,'&#39;')}'>${esc(frames[0][1])}</div></div>` : `<div class="noimg">示範圖之後補上</div>`;
function startFlips(){ FLIPS.forEach(clearInterval); FLIPS=[]; document.querySelectorAll('[data-flip]').forEach(el=>{ const imgs=[...el.querySelectorAll('img')], dots=[...el.querySelectorAll('.fd i')], cap=el.querySelector('.cap'), caps=JSON.parse(cap.dataset.caps); let k=0; if(RM()||imgs.length<2) return; FLIPS.push(setInterval(()=>{ k=(k+1)%imgs.length; imgs.forEach((im,i)=>im.classList.toggle('on',i===k)); dots.forEach((d,i)=>d.classList.toggle('on',i===k)); cap.textContent=caps[k]; },2200)); }); }
async function fillQP(){ const els=document.querySelectorAll('img[data-qp]'); if(!els.length) return; await demoP; els.forEach(el=>{ const d=JSON.parse(el.dataset.qp), u=d.src==='user'&&S.ph.img&&S.ph.lm; el.src=quadPhoto(u?S.ph.img:DEMO_IMG, u?S.ph.lm:DEMO_LM, d.qs, d.main, d.w||520, d.labels!==false); }); }
const qpTag=(qs,main,opt={},cls='')=>`<img class="${cls}" data-qp='${JSON.stringify({qs,main,...opt}).replace(/'/g,'&#39;')}' alt="身體四個區塊的辛苦程度">`;
async function fillPtStrip(){ const els=document.querySelectorAll('img[data-pt]'); if(!els.length) return; await demoP; const Hb=DEMO_LM.heL[1]-DEMO_LM.earL[1];
  els.forEach(el=>{ const [x,y]=DEMO_LM[el.dataset.pt+'L'], sz=Hb*.13, c=document.createElement('canvas'); c.width=c.height=232; const g=c.getContext('2d'); g.drawImage(DEMO_IMG,x-sz/2,y-sz/2,sz,sz,0,0,232,232); g.beginPath(); g.arc(116,116,13,0,7); g.fillStyle='#7a5638'; g.fill(); g.lineWidth=3; g.strokeStyle='#fff'; g.stroke(); g.beginPath(); g.arc(116,116,30,0,7); g.lineWidth=2; g.strokeStyle='rgba(255,255,255,.8)'; g.stroke(); el.src=c.toDataURL('image/jpeg',.85); }); }
async function fillKnee(){ for(const el of document.querySelectorAll('img[data-kx]')) el.src=await kneeExample(el.dataset.kx); }

// ---------- 畫面 ----------
function stageBar(){ const n=FLOW[S.i], cur=STAGE_OF(n); if(!cur||n==='scan'||n==='result') return ''; const inStage=FLOW.filter(x=>STAGE_OF(x)===cur), pos=inStage.indexOf(n); return `<div class="stages">${STAGES.map((s,k)=>{ const st=(k+1)<cur?'done':(k+1)===cur?'now':''; return `<div class="stg ${st}" style="--p:${Math.round(((pos+1)/inStage.length)*100)}%"><i></i>${s}</div>`; }).join('')}</div>`; }
function note(t){ return S.doc&&t?`<div class="note"><span class="h">醫師檢視｜設計說明</span>${esc(t)}</div>`:''; }
const NOBACK=['cover','scan','result','rw1','rw2','rw3'];
const ansOf = () => ({a:S.a, mv:S.mv, cmp:S.crops?S.cmp:null, meas:S.crops&&S.ph.lm?measure(S.ph.lm):null});
function render(){
  const n=FLOW[S.i];
  if(n==='inter'||n==='scan'||(n==='result'&&!S.res)) S.res=score(CFG, ansOf());
  if(n==='result') saveEntry();
  const V={cover:vCover, brief:vBrief, rw1:()=>vReward(1), rw2:()=>vReward(2), rw3:()=>vReward(3), ph1:vPh1, ph2:vPh2, ph3:vPh3, points:vPoints, look:vLook, inter:vInter, scan:vScan, result:vResult};
  const body = V[n]?V[n]() : n[0]==='Q'?vQ(n) : n[0]==='M'?vMove(n) : vCmp(n);
  const on=S.snd&&AU.on, left=NOBACK.includes(n)?'<span>時空身體地圖・空間篇</span>':`<button class="bk" data-act="back">‹ 上一步</button>`;
  $('#app').innerHTML = `${PREVIEW?'<div class="pv">醫師預覽模式：正在使用你在後台編輯的設定</div>':''}<div class="top">${left}<div class="r"><button data-act="snd" aria-pressed="${on}">${on?'音樂 開':'音樂 關'}</button><button data-act="doc" aria-pressed="${S.doc}">醫師檢視</button></div></div>${stageBar()}${body}${n==='cover'?'<p class="foot">衛教內容僅供參考，個人狀況請由醫師判斷</p>':''}`;
  $('#fab').classList.toggle('up', n==='result');
  Tele.screen(n==='inter'?'inter'+(S.slide+1):n==='result'?'report'+(S.rp+1):n);
  after(n); window.scrollTo(0,0);
}
const go=d=>{ S.i=Math.max(0,Math.min(FLOW.length-1,S.i+d)); render(); };
const next=()=>go(1), back=()=>go(-1);

function vCover(){ const H=hist(), role=Tele.role;
  return `<div class="card"><div class="vlabel">空間篇</div>
    <span class="kicker" ${F(0)}>中醫師的身體自我修復學</span>
    <h1 class="mark" ${F(.1)} style="padding-right:40px">時空身體地圖</h1>
    <img class="photo-r" style="max-height:22vh;object-fit:cover" src="img/cover_hero.jpg" alt="一位女性在窗邊安靜感受自己的身體" ${F(.2)}>
    <div class="quote" ${F(.3)}>痛的地方先放著，去找「動不了」的地方。<small>黃獻銘醫師</small></div>
    <p ${F(.4)}>這門課用兩把尺看身體：<b>時間</b>看你現在偏向哪一季；<b>空間</b>看你身體哪一邊比較辛苦。這一篇看空間，大約 5 分鐘。</p>
    <div ${F(.45)}><p class="muted sm" style="margin-bottom:4px">試用身分（幫助我們分析）：</p><div class="role">${['醫師','製課人員','一般試用'].map(r=>`<button class="opt" data-act="role" data-v="${r}" aria-pressed="${role===r}">${r}</button>`).join('')}</div></div>
    ${H.length?`<div class="clue" ${F(.5)}><b>歡迎回來！你已經記錄 ${H.length} 次了</b><div class="histrow">${H.slice(-4).map(e=>`<div class="hm">${qpTag(qsOf(e),e.m,{w:150,labels:false})}<span>${esc(e.d)}</span></div>`).join('')}</div></div>`:''}
    <button class="btn" data-act="start" ${F(.55)}>${H.length?'開始今天的紀錄':'開始'}</button>
    <details><summary class="muted ui">我有之前的「身體紀錄碼」</summary><textarea id="codein" placeholder="貼上 SK1- 開頭的紀錄碼" style="margin-top:8px"></textarea><button class="btn ghost small" data-act="importcode" style="margin-top:8px">讀取紀錄</button></details>
    ${S.doc?`<button class="btn ghost small" data-act="demohist">載入示範紀錄（模擬前兩次）</button>`:''}
  </div>${note('定位：增加學習體驗，不做精準醫療評估〔11/9 例會〕。醫師要調整題目、判斷邏輯、結果解釋，請到「醫師後台」（doctor.html）。')}`; }
function vBrief(){ const it=[['img/step_ask.jpg','問一問',QS.length+' 個簡單的問題'],['img/m1b.jpg','動一動',MOVES.length+' 個小動作'],['img/photo_setup.jpg','比一比','一張背面照'],['img/warm_thanks.jpg','看結果','你的身體地圖']];
  return `<div class="card"><h2 class="mark">我們會一起做四件事</h2><div class="pgrid">${it.map(([src,t,d],i)=>`<div class="pcard" style="cursor:default" ${F(.05+i*.1)}><img src="${src}" alt=""><span><b>${i+1}. ${t}</b>　<span class="muted sm">${d}</span></span></div>`).join('')}</div><p class="muted">沒有對錯，照你的感覺選就好。建議戴上耳機。</p><button class="btn" data-act="next">好，開始</button></div>`; }
function vQ(id){
  const q=QS.find(x=>x.id===id), k=QS.indexOf(q)+1, v=S.a[q.key]; let ui='';
  if(q.type==='bodymap'){ const sel=v||[];
    ui=`<div class="photomap"><img src="img/demo_back.jpg" alt="從背後看的人">${HOTSPOTS.map(([n,lx,ly,rx,ry])=>[['L',lx,ly],['R',rx,ry]].map(([s,x,y])=>{ const z=s+'-'+n, on=sel.includes(z); return `<button class="hs ${on?'on':''}" style="left:${x}%;top:${y}%" data-act="zone" data-z="${z}" aria-label="${s==='L'?'左':'右'}${n}" aria-pressed="${on}">${on?`<span>${s==='L'?'左':'右'}${n}</span>`:''}</button>`; }).join('')).join('')}</div>
      <div class="row"><button class="btn ghost" data-act="nopain">都沒有</button><button class="btn" data-act="qnext" ${sel.length?'':'disabled'}>好了${sel.length?`（${sel.length}）`:''}</button></div>`;
  } else if(q.type==='quadmap'){ const Z={LU:['0','0','左手・左肩'],RU:['50%','0','右手・右肩'],LD:['0','50%','左腳・左膝'],RD:['50%','50%','右腳・右膝']};
    ui=`<div class="photomap"><img src="img/demo_back.jpg" alt="從背後看的人">${Object.entries(Z).map(([qq,[l,t,lab]])=>`<button class="qz ${v===qq?'on':''}" style="left:${l};top:${t};width:50%;height:50%" data-act="ansq" data-q="${q.key}" data-v="${qq}">${lab}</button>`).join('')}</div><button class="btn ghost" data-act="ans" data-q="${q.key}" data-v="none">沒有</button>`;
  } else if(q.type==='pics'){ ui=`<div class="pgrid">${q.o.map((o,i)=>`<button class="pcard" data-act="ans" data-q="${q.key}" data-v="${esc(o)}" aria-pressed="${v===o}">${q.pics&&q.pics[i]?`<img src="${q.pics[i]}" alt="">`:''}<span>${esc(o)}</span></button>`).join('')}</div>`;
  } else { ui=`<div class="opts">${(q.o||[]).map(o=>`<button class="opt" data-act="ans" data-q="${q.key}" data-v="${esc(o)}" aria-pressed="${v===o}">${esc(o)}</button>`).join('')}</div>`; }
  return `<div class="card"><span class="kicker">問一問　${k} / ${QS.length}</span><h2 class="mark">${esc(q.t)}${idc(q.id)}</h2>${q.sub?`<p class="muted">${esc(q.sub)}</p>`:''}${ui}</div>${note(q.note)}`; }
function vReward(n){ const R={1:{t:'問題都回答完了',s:'第 1 段完成',quote:'痛的地方很常是在替別人扛的地方，它是受害者不是兇手。',say:'你說會痛的地方，我們先記下來，不急著下結論。接下來動一動，去找真正「動不了」的地方。',btn:'開始動一動'},2:{t:'動作都做完了',s:'第 2 段完成',quote:'分辨「卡住」和「在用力」。',say:'卡住，是那裡太緊、轉不開；很用力，是身體正在幫忙撐。你已經開始練習分辨了，很不簡單。',btn:'下一步：拍一張背面照'},3:{t:'左右都比完了',s:'第 3 段完成',quote:'痛的地方先放著，去找「動不了」的地方。',say:'你剛剛做的，就是醫師在診間每天在做的事：仔細看左右哪裡不一樣。',btn:'下一步'}}[n], C=2*Math.PI*40;
  return `<div class="card bigcele"><svg class="ring" viewBox="0 0 96 96" ${F(0)}><circle class="bg" cx="48" cy="48" r="40"/><circle class="fg" id="ringfg" cx="48" cy="48" r="40" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-(n-1)/3)}" transform="rotate(-90 48 48)"/><text x="48" y="55" text-anchor="middle" style="font-size:20px;fill:var(--brown);font-family:var(--fu)">${n}/3</text></svg>
    <span class="kicker" ${F(.15)}>${R.s}</span><h2 ${F(.25)}>${R.t}</h2><p ${F(.35)}>${['你做得很好','你很認真','你好棒'][n-1]}，獲得一張訊號卡：</p>
    <div class="clue" style="text-align:left" ${F(.5)}><div class="quote">${esc(R.quote)}<small>黃獻銘醫師</small></div><p class="muted">${esc(R.say)}</p></div><button class="btn" data-act="next" ${F(.65)}>${R.btn}</button></div>`; }
function vMove(id){ const m=MOVES.find(x=>x.id===id), k=MOVES.indexOf(m)+1, v=S.mv[m.id]||{}, sides=['左邊','右邊','兩邊差不多','兩邊都很難'], feel=Object.keys(CFG.logic.feelWeight), lr=v.side==='左邊'||v.side==='右邊', step2=lr&&!v.feel;
  return `<div class="card"><span class="kicker">動一動　${k} / ${MOVES.length}</span><h2 class="mark">${esc(m.name)}</h2>
    ${step2&&m.compare?`<div class="ex2">${m.compare.map(([src,cap],i)=>`<figure class="${i?'bad':''}"><img src="${src}" alt=""><figcaption>${cap}</figcaption></figure>`).join('')}</div>`:flipTag(m.frames)}
    ${m.timer&&!step2?`<div class="row" style="align-items:center"><div class="timer" id="tm" style="flex:none;width:60px">10</div><button class="btn ghost" data-act="timer">幫我數 10 秒</button></div>`:''}
    ${!step2?`<h3>${esc(m.ask)}${idc(m.id)}</h3><div class="opts grid">${sides.map(o=>`<button class="opt c" data-act="mv" data-m="${m.id}" data-k="side" data-v="${o}" aria-pressed="${v.side===o}">${o}</button>`).join('')}</div>`
      :`<h3>${esc(v.side)}的感覺，比較像哪一種？</h3><div class="opts">${feel.map(o=>`<button class="opt" data-act="mv" data-m="${m.id}" data-k="feel" data-v="${o}">${o}</button>`).join('')}</div><button class="btn ghost small" data-act="mvreset" data-m="${m.id}" style="align-self:center">重選左右</button>`}
  </div>${note(m.note)}`; }
function vPh1(){ return `<div class="card"><span class="kicker">比一比｜拍一張背面照</span><h2 class="mark">照片要拍成這樣</h2>

function b64e(str){ const b=new TextEncoder().encode(str); let s=''; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))); }
const makeCode=()=>'SK1-'+b64e(JSON.stringify(hist()));
function importCode(txt){ const m=(txt||'').trim().match(/SK1-([A-Za-z0-9_-]+)/); if(!m) return -1; try{ const arr=JSON.parse(b64d(m[1])); if(!Array.isArray(arr)) return -1; const H=hist(), ids=new Set(H.map(e=>e.id)); let n=0; arr.forEach(e=>{ if(e&&e.id&&Array.isArray(e.s)&&e.s.length===4&&!ids.has(e.id)){ H.push(e); n++; } }); H.sort((a,b)=>a.id-b.id); ls(HK,H.slice(-60)); return n; }catch(e){ return -1; } }
function demoHist(){ const H=hist(), now=Date.now(), wk=7*864e5; const add=[{id:now-8*wk,s:[14,82,100,8],m:'LD',n:3},{id:now-4*wk,s:[10,64,96,4],m:'LD',n:2}].map(e=>({...e,d:new Date(e.id).toLocaleDateString('zh-TW'),p:['右肩膀'],demo:true})); ls(HK,[...H.filter(e=>!e.demo),...add].sort((a,b)=>a.id-b.id)); }

function chartSVG(H){ const W=520,Hh=150,pl=28,pr=64,pt=12,pb=26,n=H.length,X=i=>pl+(n===1?0:i*(W-pl-pr)/(n-1)),Y=v=>pt+(1-v/100)*(Hh-pt-pb), col={LU:'#b3a593',RU:'#c49a6a',LD:'#7a5638',RD:'#9c8d7c'};

    await new Promise(res=>{ const fr=now=>{ const k=Math.min(1,(now-t0)/stepMs); if(pct) pct.textContent=Math.round(start+(end-start)*k)+'%'; if(bar) bar.style.width=(start+(end-start)*k)+'%'; const want=Math.floor((i+k)/total*PT_KEYS.length); while(shown<want){ const [x,y]=P(lm[PT_KEYS[shown]]); g.beginPath(); g.arc(x,y,4,0,7); g.fillStyle='#f1d9b3'; g.fill(); g.beginPath(); g.arc(x,y,9,0,7); g.strokeStyle='rgba(241,217,179,.5)'; g.lineWidth=1; g.stroke(); shown++; if(el) el.src=c.toDataURL('image/jpeg',.85); } if(k<1) requestAnimationFrame(fr); else res(); }; requestAnimationFrame(fr); });
    lis[i].classList.remove('run'); lis[i].classList.add('ok'); lis[i].querySelector('i').textContent='✓'; tick(); }
  if(el) el.src=quadPhoto(img,lm,S.res.qs,S.res.main,W,false); await new Promise(r=>setTimeout(r,RM()?200:900)); if(FLOW[S.i]==='scan'){ S.rp=0; next(); } }
render();
