<script>
const {cfg:CFG, preview:PREVIEW} = loadCfg();
const PTS = (CFG.sources.points||[]).filter(p=>p.enabled), LV = CFG.explain.levels, TRIAL = /[?&]trial=1/.test(location.search);
const QS = CFG.sources.questions.filter(q=>q.enabled), MOVES = CFG.sources.moves.filter(m=>m.enabled), CMPS = CFG.sources.compares.filter(c=>c.enabled), EX = CFG.explain;
const HP = [['頭頸',470,285,566,289],['肩膀',378,372,646,388],['上背',446,528,585,530],['手肘手腕',343,707,691,719],['腰',445,653,584,657],['屁股',440,822,578,826],['膝蓋',417,1075,587,1084],['腳踝腳跟',399,1390,599,1390]];

const DC={}; async function fillDC(){ const els=document.querySelectorAll('img[data-dc]'); if(!els.length) return; await demoP; els.forEach(el=>{ const k=el.dataset.dc; if(!DC[k]){ const b=k.split(',').map(Number), W=Math.min(900,Math.round(b[2]-b[0])), H=Math.round(W*(b[3]-b[1])/(b[2]-b[0])), c=document.createElement('canvas'); c.width=W; c.height=H; drawCrop(c.getContext('2d'),DEMO_IMG,b,W,H); DC[k]=c.toDataURL('image/jpeg',.88); } el.src=DC[k]; }); }

// ---------- 聲音 ----------
const AU={ctx:null,on:false};
function auInit(){ if(AU.ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; const C=AU.ctx=new AC(); AU.master=C.createGain(); AU.master.gain.value=0; AU.master.connect(C.destination);
  const len=C.sampleRate*3.8, buf=C.createBuffer(2,len,C.sampleRate); for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8); }
  AU.rev=C.createConvolver(); AU.rev.buffer=buf; const rg=C.createGain(); rg.gain.value=.6; AU.rev.connect(rg); rg.connect(AU.master); AU.dry=C.createGain(); AU.dry.gain.value=.55; AU.dry.connect(AU.master); AU.sfx=C.createGain(); AU.sfx.gain.value=.45; AU.sfx.connect(C.destination); AU.sfx.connect(AU.rev); }
function musicStart(){ auInit(); if(!AU.ctx) return; const C=AU.ctx; C.resume(); if(AU.on) return; AU.on=true; const lp=C.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520; lp.connect(AU.dry); lp.connect(AU.rev);

  if(act==='fit'){ S.fit=b.dataset.v; updEntry({fit:S.fit}); Tele.ev('fit',{k:S.fit,d:{main:S.res.main}}); praise(()=>render(),'謝謝你！'); return; }
  if(act==='docj'){ S.docJ=b.dataset.v; updEntry({doc:S.docJ}); Tele.ev('docjudge',{k:S.docJ,d:{tool:S.res.main}}); render(); return; }
  if(act==='report'){ Tele.ev('report_open'); openReport(); return; }
  if(act==='closerep'){ const s=$('#sheet'); s&&s.remove(); return; }
  if(act==='rtype'){ S.rtype=b.dataset.v; document.querySelectorAll('#rtypes .opt').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); return; }
  if(act==='sendrep'){ const ctx=screenCtx(), msg=$('#r_msg').value.trim(), name=$('#r_name').value.trim(); if(!msg){ toast('請先寫下想說的話'); return; }
    const text=`類型：${S.rtype}\n畫面：${ctx.stage}（${ctx.id}）\n${ctx.text?'題目：'+ctx.text+'\n':''}回報人：${name||'（未填）'}｜身分：${Tele.role||'未選'}\n\n${msg}`;
    const L=ls(RK)||[]; L.push(text); ls(RK,L.slice(-100)); const ok=await api({type:'report', sid:Tele.sid, role:Tele.role, ver:Tele.ver, kind:S.rtype, screen:ctx.stage, item:ctx.id, text});
    Tele.ev('report_send',{k:S.rtype}); toast(ok?'已送出，謝謝你！':'目前送不出去，已先存在這支手機'); const s=$('#sheet'); setTimeout(()=>s&&s.remove(),500); return; }
});
document.addEventListener('change', async e=>{ if(e.target.id!=='file'||!e.target.files[0]) return; Tele.ev('photo',{k:'upload'}); $('#phmsg').innerHTML='<div class="spin"></div><p class="muted" style="text-align:center">電腦正在你的手機裡找身體的位置⋯大約 10～20 秒</p>';
  const c=await fileToCanvas(e.target.files[0]), d=await detect(c); S.ph={mode:'upload', img:c, lm:d.lm, ai:d.ai, feetWarn:!!(d.feet&&d.feet.vis>.5&&(d.feet.outL+d.feet.outR)/2>25)}; if(S.ph.feetWarn) Tele.ev('feet_out'); Tele.ev('ai',{k:d.ai}); S.i=FLOW.indexOf(PTS[0].id); render(); });
function toast(t){ let el=$('#toast'); if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); } el.textContent=t; el.hidden=false; clearTimeout(window._tt); window._tt=setTimeout(()=>el.hidden=true,2400); }
function after(n){
  fillQP(); fillDC(); startFlips(); fillKnee(); if(n==='axes'){ setTimeout(()=>{ const a=$('#ax'); a&&a.classList.add('go'); },60); startAxHero(); }
  if(n==='ph1') layoutDref(); if(n==='cover') startHero(); else clearInterval(window._hero);
  if(n[0]==='K'){ const p=PTS.find(x=>x.id===n); drawPointsOn($('#cv'), S.ph.img, S.ph.lm, ()=>Tele.ev('drag'), p.keys); fillPtEx(); }
  if(n==='look'){ const m=makeCrops(S.ph.img,S.ph.lm); S.regions=m.regions; const cv=$('#pv'), img=S.ph.img, box=partBox(S.ph.lm,'all'), [x0,y0,x1,y1]=box, W=Math.min(900,Math.round(x1-x0)), sc=W/(x1-x0), H=Math.round((y1-y0)*sc); cv.width=W; cv.height=H; const g=cv.getContext('2d'); drawCrop(g,img,box,W,H);
    CMPS.forEach((c,i)=>S.regions[c.key].forEach(([x,y,sz])=>{ const px=(x-x0)*sc, py=(y-y0)*sc, rr=sz*.45*sc; g.beginPath(); g.arc(px,py,rr,0,7); g.lineWidth=Math.max(3,W/160); g.strokeStyle='#7a5638'; g.stroke(); const r=Math.max(18,W/26), bx=px+rr*.72, by=py-rr*.72; g.beginPath(); g.arc(bx,by,r,0,7); g.fillStyle='#7a5638'; g.fill(); g.fillStyle='#fff'; g.font=`${Math.round(r*1.2)}px sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(String(i+1),bx,by); g.textAlign='left'; g.textBaseline='alphabetic'; })); }
  if(n==='rw1'||n==='rw2'||n==='rw3'){ petals(22); chime(true); const k={rw1:1,rw2:2,rw3:3}[n], C=2*Math.PI*40; setTimeout(()=>{ const f=$('#ringfg'); if(f) f.style.strokeDashoffset=C*(1-k/3); },150); }
  if(n==='inter'&&S.slide===0){ petals(26); chime(true); }
  if(n==='scan') runScan();
  if(n==='result'){ annotate(); fillCue(); buildShare(); if(S.rp===0){ petals(18); chime(true); } }
}
async function runScan(){ await demoP; const u=S.ph.img&&S.ph.lm, img=u?S.ph.img:DEMO_IMG, lm=u?S.ph.lm:DEMO_LM, [x0,y0,x1,y1]=bodyBox(lm,img.width,img.height), W=360, sc=W/(x1-x0), H=Math.round((y1-y0)*sc), c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  g.drawImage(img,x0,y0,x1-x0,y1-y0,0,0,W,H); g.fillStyle='rgba(30,22,16,.35)'; g.fillRect(0,0,W,H); const P=p=>[(p[0]-x0)*sc,(p[1]-y0)*sc], el=$('#scanimg'); if(el) el.src=c.toDataURL('image/jpeg',.85);
  const lis=[...document.querySelectorAll('#checks li')], pct=$('#pct'), bar=$('#bar'), total=lis.length, stepMs=RM()?250:950; let shown=0;
  for(let i=0;i<total;i++){ if(FLOW[S.i]!=='scan') return; lis[i].classList.add('run'); const start=Math.round(i/total*100), end=Math.round((i+1)/total*100), t0=performance.now();
    await new Promise(res=>{ const fr=now=>{ const k=Math.max(0,Math.min(1,(now-t0)/stepMs)); if(pct) pct.textContent=Math.round(start+(end-start)*k)+'%'; if(bar) bar.style.width=(start+(end-start)*k)+'%'; const want=Math.floor((i+k)/total*PT_KEYS.length); while(shown<want){ const [x,y]=P(lm[PT_KEYS[shown]]); g.beginPath(); g.arc(x,y,4,0,7); g.fillStyle='#f1d9b3'; g.fill(); g.beginPath(); g.arc(x,y,9,0,7); g.strokeStyle='rgba(241,217,179,.5)'; g.lineWidth=1; g.stroke(); shown++; if(el) el.src=c.toDataURL('image/jpeg',.85); } if(k<1) requestAnimationFrame(fr); else res(); }; requestAnimationFrame(fr); });
    lis[i].classList.remove('run'); lis[i].classList.add('ok'); lis[i].querySelector('i').textContent='✓'; tick(); }
  if(el) el.src=quadPhoto(img,lm,S.res.qs,S.res.main,W,false); await new Promise(r=>setTimeout(r,RM()?200:900)); if(FLOW[S.i]==='scan'){ S.rp=0; next(); } }
const FD=friendData(); if(FD) friendView(FD); else render();
